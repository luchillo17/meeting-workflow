[project]
name = "meeting-workflow"
version = "0.1.0"
description = "Local-first workflow for meeting recordings"
requires-python = ">=3.12"
dependencies = [
    "Pillow>=10.0.0",
    "faster-whisper>=1.2.1",
    "nvidia-cublas-cu12>=12.9.2.10; sys_platform != 'darwin'",
    "nvidia-cudnn-cu12==9.*; sys_platform != 'darwin'",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[project.optional-dependencies]
diarization = [
    "pyannote.audio>=3.1.1",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
]

[project.scripts]
meeting-workflow = "workflow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workflow"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "deptry>=0.23.0",
    "pre-commit>=4.2.0",
    "pytest>=9.1.1",
    "ruff>=0.11.0",
]

[tool.deptry]
known_first_party = ["workflow"]

[tool.deptry.package_module_name_map]
Pillow = "PIL"
pyyaml = "yaml"
"nvidia-cublas-cu12" = "nvidia"
"nvidia-cudnn-cu12" = "nvidia"

[tool.deptry.per_rule_ignores]
# Transitive runtime deps of faster-whisper; imported lazily for GPU checks/cleanup.
DEP001 = ["ctranslate2", "torch", "pyannote"]
DEP002 = ["pyannote.audio", "torchaudio"]
DEP003 = ["ctranslate2", "torch", "pyannote"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
