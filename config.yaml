# Meeting Workflow configuration

ollama:
  base_url: "http://localhost:11434"
  # Qwen 3.5 is natively multimodal — same tag for text + vision (replaces qwen2.5 + qwen2.5vl)
  text_model: "qwen3.5:9b" # fits fully in 16 GB VRAM (Q4); 27b spills to RAM
  vision_model: "qwen3.5:9b"
  timeout_seconds: 600
  keep_alive: "10m" # keep vision model loaded across frames in a stage
  unload_between_stages: true # free VRAM before loading the next Ollama model

extraction:
  mode: auto # single | map_reduce | auto (map_reduce when transcript exceeds chapter_trigger_chars)
  chapter_trigger_chars: 12000 # auto mode threshold for map-reduce vs single pass
  chapter_target_chars: 8000 # per-chapter size target (segment boundaries)
  chapter_min_chars: 1500 # merge trailing short chapter into previous
  grounding_check: true # LLM pass drops items unsupported by chapter text
  deterministic_grounding: true # token-overlap filter after LLM extraction
  grounding_min_overlap: 0.34 # min fraction of bullet tokens found in transcript/vision
  grounding_min_token_length: 4
  max_transcript_chars: 12000 # single-pass cap; qwen3.5 JSON mode breaks above ~17k prompt chars
  transcript_sampling: head_tail # head = truncate start only; head_tail keeps opening + closing
  head_tail_start_ratio: 0.7 # fraction of max_transcript_chars for the opening (rest = closing)
  max_visual_frames: 8 # cap frames fed to extraction (full set still in visual_content.json)
  max_visual_description_chars: 400 # per-frame cap in extraction prompt
  visual_time_padding_seconds: 30 # include frames within this many seconds of a chapter window
  retry_on_language_drift: true # re-prompt if output.language is violated
  retry_on_empty_extraction: true # re-prompt when long transcript yields empty lists

whisper:
  model: "large-v3" # use "medium" for faster pilot runs
  device: "cuda"
  compute_type: "float16"
  language: "es"
  vad_filter: true # Silero VAD — skip non-speech audio before decoding
  condition_on_previous_text: false # reduces hallucination carry-over between windows
  hallucination_silence_threshold: 2.0 # skip suspicious segments in long silence (needs word_timestamps)
  no_speech_threshold: 0.6 # segment logprob threshold for silence
  compression_ratio_threshold: 2.4 # gzip ratio guard for repetitive garbage
  log_prob_threshold: -1.0 # average logprob guard
  filter_hallucination_phrases: true # post-filter known silence phrases (e.g. repeated "Gracias.")

frames:
  scene_threshold: 0.25 # lower catches video-call tile/layout changes (e.g. someone joining)
  interval_seconds: 60 # gap-fill step when no scene/cue for a long stretch
  gap_fill_seconds: 120 # only add interval samples after this many seconds without a keyframe
  max_frames: 20 # cap per meeting (pilot-friendly)
  min_spacing_seconds: 30 # applies to interval samples only; scene/cue always kept
  dedup_global: true # collapse same layout across the whole meeting (ignores speaker highlight)
  dedup_window_seconds: 20 # used only when dedup_global is false
  dedup_hash_threshold: 8 # layout hash distance; higher tolerates minor UI chrome
  dedup_layout_blur: 4 # blur radius before hashing; smooths active-speaker highlight rings
  jpeg_quality: 3 # ffmpeg -q:v (lower = better quality)
  max_width: 1280

vision:
  # Post-filter: drop bot chrome and tile-only frames; keep slide/diagram/whiteboard + shared content
  keep_structured_types: true

visual_cues:
  - tablero
  - diagrama
  - pantalla
  - dibujo
  - figura
  - matriz
  - flujo
  - arquitectura
  - miro
  - whiteboard
  - screen
  - share

output:
  base_dir: "output"
  language: "es" # extraction + vision text output (ISO 639-1); defaults to whisper.language
