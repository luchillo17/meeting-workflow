# Meeting Workflow configuration

ollama:
  base_url: "http://localhost:11434"
  text_model: "qwen2.5:14b" # quality preset; use qwen2.5:7b for faster runs
  vision_model: "qwen2.5vl:7b"
  timeout_seconds: 600
  keep_alive: "10m" # keep vision model loaded across frames in a stage
  unload_between_stages: true # free VRAM before loading the next Ollama model

extraction:
  max_transcript_chars: 48000 # 0 = no limit; raise if long meetings lose tail context

whisper:
  model: "large-v3" # use "medium" for faster pilot runs
  device: "cuda"
  compute_type: "float16"
  language: "es"
  vad_filter: true # Silero VAD — skip non-speech audio before decoding
  condition_on_previous_text: false # reduces hallucination carry-over between windows
  hallucination_silence_threshold: 2.0 # skip suspicious segments in long silence (needs word_timestamps)
  no_speech_threshold: 0.6 # segment logprob threshold for silence
  compression_ratio_threshold: 2.4 # gzip ratio guard for repetitive garbage
  log_prob_threshold: -1.0 # average logprob guard
  filter_hallucination_phrases: true # post-filter known silence phrases (e.g. repeated "Gracias.")

frames:
  scene_threshold: 0.25 # lower catches Teams tile/layout changes (e.g. someone joining)
  interval_seconds: 60 # gap-fill step when no scene/cue for a long stretch
  gap_fill_seconds: 120 # only add interval samples after this many seconds without a keyframe
  max_frames: 20 # cap per meeting (pilot-friendly)
  min_spacing_seconds: 30 # applies to interval samples only; scene/cue always kept
  dedup_global: true # collapse same layout across the whole meeting (ignores speaker highlight)
  dedup_window_seconds: 20 # used only when dedup_global is false
  dedup_hash_threshold: 8 # layout hash distance; higher tolerates minor UI chrome
  dedup_layout_blur: 4 # blur radius before hashing; smooths Teams active-speaker rings
  jpeg_quality: 3 # ffmpeg -q:v (lower = better quality)
  max_width: 1280

visual_cues:
  - tablero
  - diagrama
  - pantalla
  - dibujo
  - figura
  - matriz
  - flujo
  - arquitectura
  - miro
  - whiteboard
  - screen
  - share

output:
  base_dir: "output"
  language: "es" # extraction + vision text output (ISO 639-1); defaults to whisper.language
